name: Release

# Publishes a release when a v* tag is pushed (docs/development/releasing.md):
#   ci       the full CI (ci.yml) at the tagged commit
#   build    builds, packages and verifies the archives with Hephaestus, with a
#            read-only token and no secret; only the verified dist/ moves on
#   release  publishes dist/ as the GitHub Release (GITHUB_TOKEN), then opens
#            the formula pull request on magicdrive/homebrew-tap (the tap
#            token of the `release` environment)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true

      - name: Build, archive and checksum
        uses: magicdrive/hephaestus@4414722a804d958179fd547c26d7b2fe762e308e # v1.1.1-0.20261025105032-4414722a804d
        with:
          command: run
          stages: build,archive,checksum
          fresh: "true"
          github-token: ""

      # names, contents, platforms, and `enma --version` naming the tag
      - name: Verify archives
        run: sh scripts/verify-dist.sh dist "$GITHUB_REF_NAME"

      - name: Go toolchain of the release binaries
        run: sh scripts/release-toolchain.sh dist/bin

      # install.sh installs this machine's archive from exactly these files
      - name: install.sh with the release archives
        env:
          ENMA_INSTALLER_DIST: ${{ github.workspace }}/dist
          ENMA_INSTALLER_SHELLS: sh
          ENMA_INSTALLER_DOWNLOADERS: curl
        run: go test -count=1 -v -run '^TestDistArchives$' ./internal/installer/

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write     # create the release and upload its assets
      id-token: write     # sign the provenance attestations
      attestations: write
    steps:
      # hephaestus.yaml only; no build code runs in this job
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Without the token a dry run cannot read the tap and would pass. Only
      # whether it is set reaches this step, not its value.
      - name: Check that the tap token is set
        env:
          TAP_TOKEN_SET: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN != '' }}
        run: |
          [ "$TAP_TOKEN_SET" = true ] || { echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set in the release environment"; exit 1; }

      # Checks the tap token, the tap's layout, a newer formula on the tap
      # and the pull request branch before the release becomes public, since
      # a published release cannot be taken back. A prerelease skips the tap
      # (skip_upload: auto).
      - name: Rehearse the formula and tap pull request (dry run)
        uses: magicdrive/hephaestus@4414722a804d958179fd547c26d7b2fe762e308e # v1.1.1-0.20261025105032-4414722a804d
        with:
          command: run
          stages: formula,tap
          dry-run: "true"
          github-token: ""
          tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/enma_*.tar.gz
            dist/enma_*.zip
            dist/enma_checksums.txt

      - name: Publish the GitHub Release
        uses: magicdrive/hephaestus@4414722a804d958179fd547c26d7b2fe762e308e # v1.1.1-0.20261025105032-4414722a804d
        with:
          command: release

      - name: Formula and tap pull request
        uses: magicdrive/hephaestus@4414722a804d958179fd547c26d7b2fe762e308e # v1.1.1-0.20261025105032-4414722a804d
        with:
          command: run
          stages: formula,tap
          github-token: ""
          tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
