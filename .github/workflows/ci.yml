name: CI

# Light gate for every push to main and every pull request, and the release
# gate: release.yml runs this workflow (workflow_call) at the tagged commit
# before anything is built for a release.
# The slower checks (shuffle, fuzz, more platforms) are in ci-extended.yml.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes a running check. Called from
# release.yml, github.workflow is "Release" and github.ref the tag, so this
# group never matches the release's own and is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The completion tests (internal/commandline) run each script in its
      # shell; a shell named here that is missing fails them instead of
      # skipping it.
      ENMA_COMPLETION_SHELLS: bash zsh fish
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Install zsh and fish for the completion tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q zsh fish
          else
            brew install fish
          fi
          bash --version | head -1; zsh --version; fish --version

      # The install.sh tests (internal/installer) run the script with each shell
      # and downloader named here, and with the BusyBox tools on Linux; one that
      # is missing fails them instead of skipping it.
      - name: Install busybox and wget for the installer tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q busybox wget
            {
              # /bin/sh is dash on Ubuntu
              echo "ENMA_INSTALLER_SHELLS=sh bash bash-nonposix busybox"
              echo "ENMA_INSTALLER_BUSYBOX=required"
            } >> "$GITHUB_ENV"
          else
            command -v wget >/dev/null || brew install wget
            echo "ENMA_INSTALLER_SHELLS=sh dash bash bash-nonposix ksh" >> "$GITHUB_ENV"
          fi
          echo "ENMA_INSTALLER_DOWNLOADERS=curl wget" >> "$GITHUB_ENV"
          curl --version | head -1; wget --version | head -1

      # install.sh, and on Linux shellcheck of it and of scripts/*.sh
      - name: Check install.sh and the scripts
        run: |
          sh -n install.sh
          if [ "$RUNNER_OS" = Linux ]; then
            shellcheck --version | head -2
            make shellcheck
          fi

      # observations of the known limitation G4-04 (macOS / BSD, see README
      # "What is watched") go to this file and are printed after the tests
      - name: G4-04 observation log
        run: echo "ENMA_G404_LOG=$RUNNER_TEMP/enma-G4-04.log" >> "$GITHUB_ENV"

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      # Includes the CLI end-to-end tests (internal/e2e): README commands,
      # init templates, config validate, exit codes and process lifecycle.
      # -count=1: no cached results. The e2e tests build enma with `go build`
      # instead of importing it, so a change of enma would not invalidate them.
      - name: Test
        run: go test -count=1 ./...

      # The install.sh tests ran with every shell and downloader above; -race
      # checks only their Go side, so one shell and curl are enough here.
      - name: Test (race)
        env:
          ENMA_INSTALLER_SHELLS: sh
          ENMA_INSTALLER_DOWNLOADERS: curl
        run: go test -count=1 -race ./...

      - name: Smoke (build, --version, --help)
        run: make smoke

      # Not a failure: the known limitation G4-04 is accepted and monitored. The
      # count is kept in the job log and the job summary for later runs.
      - name: G4-04 observations
        if: always()
        run: sh scripts/g404-report.sh

  # The tests above use the oldest supported Go (go.mod); releases are built
  # with a newer one, so run the tests with the newest Go release too.
  test-stable-go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true

      - name: Test (race)
        run: go test -count=1 -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The pinned staticcheck (Makefile STATICCHECK) runs with the newest Go.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true

      - name: Staticcheck
        run: make staticcheck  # version pinned in the Makefile (STATICCHECK)

      - name: Go vet for windows
        run: GOOS=windows go vet ./...

      - name: go mod tidy
        run: make tidy-check

      - name: Govulncheck (with the newest Go)
        run: make vuln  # version pinned in the Makefile (GOVULNCHECK_VERSION)

      - name: Lint the workflows (actionlint)
        run: make actionlint  # version pinned in the Makefile (ACTIONLINT_VERSION)

      # The Node.js Renovate's engines require (run.sh installs with
      # --engine-strict). The npm cache holds only tarballs; `npm ci` checks
      # each against the lockfile's integrity.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.github/renovate-check/.node-version'
          cache: npm
          cache-dependency-path: '.github/renovate-check/package-lock.json'

      - name: Test the pinned Renovate install
        run: make renovate-check-test

      - name: Validate renovate.json
        run: make renovate-check  # Renovate pinned by .github/renovate-check/package-lock.json

  # Builds every release archive with Hephaestus exactly as the build job of
  # release.yml does, but without a tag (version 0.0.0-SNAPSHOT), and checks
  # them: names and contents (scripts/verify-dist.sh), and install.sh
  # installing this machine's archive from them (TestDistArchives). Nothing is
  # published and no token is given.
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true

      - name: Release Go equals the release toolchain
        # release.yml sets up the Go of builds[].env.GOTOOLCHAIN, not stable.
        run: |
          want=$(sed -n 's/^ *GOTOOLCHAIN: *"\{0,1\}go\([0-9.]*\)"\{0,1\}$/\1/p' hephaestus.yaml)
          got=$(sed -n 's/^ *go-version: *"\([0-9.]*\)"$/\1/p' .github/workflows/release.yml)
          echo "hephaestus.yaml GOTOOLCHAIN=go$want release.yml go-version=$got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::release.yml go-version ($got) differs from GOTOOLCHAIN in hephaestus.yaml (go$want)"; exit 1; }

      - name: Check hephaestus.yaml
        uses: magicdrive/hephaestus@e544acf59c79cbafa04a48002b0f30f91a02f8ba # v1.3.0
        with:
          command: check
          github-token: ""

      - name: Hephaestus snapshot (build, archive, checksum)
        id: snapshot
        uses: magicdrive/hephaestus@e544acf59c79cbafa04a48002b0f30f91a02f8ba # v1.3.0
        with:
          command: run
          stages: build,archive,checksum
          snapshot: "true"
          fresh: "true"
          github-token: ""

      - name: Verify archives
        run: sh scripts/verify-dist.sh dist 0.0.0-SNAPSHOT

      - name: Go toolchain of the release binaries
        run: sh scripts/release-toolchain.sh dist/bin

      - name: install.sh with the snapshot archives
        env:
          ENMA_INSTALLER_DIST: ${{ github.workspace }}/dist
          ENMA_INSTALLER_SHELLS: sh
          ENMA_INSTALLER_DOWNLOADERS: curl
        run: go test -count=1 -v -run '^TestDistArchives$' ./internal/installer/

      - name: Artifacts
        env:
          ARTIFACTS: ${{ steps.snapshot.outputs.artifacts }}
        run: echo "$ARTIFACTS" | jq .

  # The Homebrew formula a release would publish, generated from the archives
  # of a local, never published build (tag v99.0.0, as `make homebrew-e2e`)
  # and installed with the real Homebrew in a throw-away tap: style,
  # audit --strict, install, the binary and its completions, test, uninstall.
  homebrew-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true

      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Build, archive, checksum and formula for v99.0.0 (nothing is published)
        uses: magicdrive/hephaestus@e544acf59c79cbafa04a48002b0f30f91a02f8ba # v1.3.0
        with:
          command: run
          stages: build,archive,checksum,formula
          tag: v99.0.0
          fresh: "true"
          github-token: ""

      - name: Formula → brew style, audit, install, test, uninstall
        run: scripts/homebrew-e2e.sh dist

  # The single required check of the main ruleset, and the check
  # `make publish` waits for on the commit being tagged (docs/development/
  # releasing.md). It needs every other job of this workflow and fails unless
  # all of them succeeded. ci-extended.yml (weekly, by hand, or on the label
  # `ci-extended`) is a separate workflow and not part of it.
  ci-gate:
    if: always()
    needs: [test, test-stable-go, lint, dist, homebrew-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
