version: 2

project_name: enma

release:
  github:
    owner: magicdrive
    name: enma
  draft: false
  prerelease: auto  # a tag like v1.3.0-rc.1 is published as a pre-release

builds:
  - id: enma
    goos:
      - linux
      - darwin
      - windows
    ignore:
      - goos: darwin
        goarch: "386"
    ldflags:
      - -s -w -X "main.version=v{{.Version}}"
    env:
      - CGO_ENABLED=0
    binary: enma
    main: ./main.go

archives:
  - id: tar.gz
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: misc/completions/enma-completion.sh
        dst: completions/enma-completion.sh
      - src: misc/completions/zsh/_enma
        dst: completions/zsh/_enma
      - src: misc/completions/bash/enma-completion.bash
        dst: completions/bash/enma-completion.bash
      - src: misc/completions/fish/enma.fish
        dst: completions/fish/enma.fish

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# `brews` is deprecated in GoReleaser v2 in favour of `homebrew_casks`.
# It is kept on purpose (owner decision 2026-10-18): moving to a cask changes
# what the tap publishes (a formula -> a cask in Casks/). `goreleaser check`
# reports the deprecation (exits non-zero); the release still works.
brews:
  - name: enma
    repository:
      owner: magicdrive
      name: homebrew-tap
      branch: main
    homepage: "https://github.com/magicdrive/enma"
    description: "Yet another event-driven command runner."
    license: "MIT"
    ids: [tar.gz]
    skip_upload: auto  # a pre-release does not update the Homebrew tap
    install: |
      bin.install "enma"
    extra_install: |
      bash_completion.install "completions/bash/enma-completion.bash" => "enma"
      zsh_completion.install "completions/zsh/_enma" => "_enma"
      fish_completion.install "completions/fish/enma.fish"
    test: |
      system "#{bin}/enma", "--version"
    commit_author:
      name: magicdrive bot
      email: hiroshi.ikegami+githubbot@magicdrive.jp
